name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual trigger

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # SDK 10 (default) fixes the dotnet test/VSTest dispatch; the 9.0 runtime is
        # required to run the net9.0 test app (no major-version roll-forward by default).
        dotnet-version: |
          9.0.x
          10.0.x
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Run tests
      # TUnit uses Microsoft.Testing.Platform, so run the test app directly instead of
      # `dotnet test` (which defaults to the unsupported VSTest target on the .NET 10 SDK).
      run: dotnet run --project Tests/Tests.csproj --configuration Release --no-build
    
    - name: Pack
      run: dotnet pack lettermint-dotnet/lettermint-dotnet.csproj --configuration Release --no-build --output ./nupkg
    
    - name: Push to NuGet
      run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{secrets.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./nupkg/*.nupkg
